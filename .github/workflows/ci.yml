name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.30"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.30"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - name: Mypy
        run: uv run mypy src/

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.30"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - name: Bandit
        run: uv run bandit -c pyproject.toml -r src/
      - name: Detect secrets
        run: uv run detect-secrets scan --baseline .secrets.baseline || true

  test:
    name: Tests (coverage >= 85%)
    runs-on: ubuntu-latest
    # Postgres 16 service — mirrors homelab CI's pg16 (scripts/ci-homelab.sh Stage 2.5/2.7).
    # POSTGRES_USER/PASSWORD/DB are all the CI-only throwaway value "swingrl_test" — this
    # database exists only for the lifetime of the job, no real credential involved.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: swingrl_test
          POSTGRES_PASSWORD: swingrl_test  # pragma: allowlist secret
          POSTGRES_DB: swingrl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://swingrl_test:swingrl_test@localhost:5432/swingrl_test  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.30"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: uv sync --locked --group dev
      - name: Initialize schema (legacy DDL + versioned migrations)
        # Mirrors scripts/ci-homelab.sh Stage 2.7 exactly: init_schema() first (legacy
        # postgres_schema.py DDL that V001 ALTERs depend on), then apply_migrations().
        # Inline (not scripts/init_db.py): that script's post-init verification step has a
        # pre-existing dict-row bug (`result[0]`) unrelated to this change that makes it
        # exit non-zero even though schema creation itself succeeds.
        run: |
          uv run python -c "
          from swingrl.config.schema import load_config
          from swingrl.data.db import DatabaseManager
          from swingrl.data.migration_runner import apply_migrations, current_schema_version
          db = DatabaseManager(load_config('config/swingrl.yaml'))
          db.init_schema()
          n = apply_migrations(db)
          print(f'applied={n} current_version={current_schema_version(db)}')
          "
      - name: Run tests with coverage
        run: uv run pytest tests/ -v --cov=swingrl --cov-report=term-missing --cov-fail-under=85
