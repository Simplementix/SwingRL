# config/swingrl.yaml — SwingRL development defaults
# Override any field with SWINGRL_ env var prefix.
# Nested fields use double-underscore: SWINGRL_EQUITY__MAX_POSITION_SIZE=0.30
# Load via: from swingrl.config.schema import load_config; cfg = load_config()

trading_mode: paper  # "paper" | "live"

equity:
  symbols: [SPY, QQQ, VTI, XLV, XLI, XLE, XLF, XLK]
  hmm_proxy_symbol: SPY         # market proxy for HMM regime detection (must be in symbols)
  max_position_size: 0.25       # max fraction of equity capital in one ETF position
  max_drawdown_pct: 0.10        # circuit breaker: halt equity env at 10% DD
  daily_loss_limit_pct: 0.02    # circuit breaker: halt equity env at 2% daily loss
  min_order_usd: 1.0            # Alpaca minimum order floor ($1.00 fractional shares)
  cycle_time_et: "15:45"        # daily rebalance time (ET); 15m before close so fills land intraday
  market_calendar_gate: true    # gate the equity cycle on the Alpaca market clock (fail-safe)
  order_fill_timeout_s: 60      # cancel an unfilled order after N seconds (never a $0 trade)
  order_poll_interval_s: 2      # poll order status every N seconds during the fill wait

crypto:
  symbols: [BTCUSDT, ETHUSDT]
  hmm_proxy_symbol: BTCUSDT     # market proxy for HMM regime detection (must be in symbols)
  max_position_size: 0.50       # BTC can be up to 50% of crypto capital
  max_drawdown_pct: 0.12        # circuit breaker: halt crypto env at 12% DD
  daily_loss_limit_pct: 0.03    # circuit breaker: halt crypto env at 3% daily loss
  min_order_usd: 10.0           # Binance.US minimum order floor ($10.00)

capital:
  equity_usd: 400.0             # initial equity environment capital (USD)
  crypto_usd: 47.0              # initial crypto environment capital (USD)

paths:
  data_dir: data/
  db_dir: db/
  models_dir: models/
  logs_dir: logs/

logging:
  level: INFO                   # DEBUG | INFO | WARNING | ERROR
  json_logs: false              # true in production/Docker (SWINGRL_LOGGING__JSON_LOGS=true)

environment:
  initial_amount: 100000.0               # $100K normalized training capital (both envs)
  equity_episode_bars: 252               # equity episode length (trading days)
  crypto_episode_bars: 540               # crypto episode length (4H bars ~3 months)
  equity_transaction_cost_pct: 0.0006    # 0.06% round-trip (spread + slippage)
  crypto_transaction_cost_pct: 0.0022    # 0.22% round-trip (commission + spread + slippage)
  signal_deadzone: 0.02                  # hold threshold: suppress weight changes < 2%
  position_penalty_coeff: 10.0           # soft penalty for position limit breach
  drawdown_penalty_coeff: 5.0            # soft penalty for drawdown threshold breach
  zero_turbulence_obs: true              # F1b: freeze turbulence obs slot at 0.0 for era-0 models
                                         # (real value still captured); flip to false at era-1 cutover

system:
  database_url: ""                       # PostgreSQL — override via DATABASE_URL env var in Docker

alerting:
  alert_cooldown_minutes: 30               # minimum minutes between repeat alerts
  consecutive_failures_before_alert: 3     # failures before triggering alert
  alerts_webhook_url: ""                   # Discord webhook for critical/warning alerts
  daily_webhook_url: ""                    # Discord webhook for daily summary/info
  healthchecks_equity_url: ""              # Healthchecks.io equity cycle ping URL
  healthchecks_crypto_url: ""              # Healthchecks.io crypto cycle ping URL

scheduler:
  enabled: true                           # set true for live/paper trading; false during training-only
  apscheduler_db_path: db/apscheduler_jobs.sqlite  # SEPARATE from trading_ops.db
  misfire_grace_time: 300                  # default grace (seconds) for non-cycle jobs
  misfire_grace_s:                         # per-env grace for the trading cycle jobs (A30)
    equity: 720                            # a restart shortly after 15:45 still runs late; past ~15:57 it skips
    crypto: 3600                           # 4H cadence — an hour late is immaterial
  max_workers: 4                           # APScheduler thread pool size

backup:
  backup_retention_days: 14         # days to keep database backups
  duckdb_rotate: false              # rotate DuckDB snapshots (off in dev)
  backup_dir: backups/              # relative to repo root
  # offsite_host: ""                # rsync destination host (production only)
  # offsite_path: ""                # rsync destination path (production only)
  # 2026-07-19: host-side dumps + Duplicati are the backup path; trader image has no pg_dump
  trader_backup_jobs_enabled: false

options_collector:
  enabled: true
  provider: cboe                    # primary (spec §17 C1); schwab/moomoo = fallbacks (C2)
  endpoint_url_template: "https://cdn.cboe.com/api/global/delayed_quotes/options/{symbol}.json"
  index_symbols: ["_SPX"]           # CBOE URL symbol; verified live 2026-07-14
  include_equity_symbols: true      # also capture chains for config.equity.symbols
  output_dir: "data/options_eod/cboe"
  schema_version: "v1"
  apscheduler_db_path: db/apscheduler_options.sqlite   # SEPARATE from the trader's jobstore
  postgres_store_raw_json: true     # also store raw_json JSONB in Postgres; revisit at first-run
  request_timeout_s: 30.0
  rate_limit_per_sec: 1.0           # courtesy throttle; 9 GETs per run
  health_check_time_et: "17:15"
  health_lookback_days: 3           # D9: health check scans the last N trading days
  snapshots:                        # pull trails market time by the feed delay (D8; T6-measured 2026-07-15: content delay 15m27s — 16:00/16:35 confirmed)
    - { label: decision, market_time_et: "15:45", pull_time_et: "16:00", misfire_grace_s: 900 }
    - { label: eod,      market_time_et: "16:15", pull_time_et: "16:35", misfire_grace_s: 18000 }
  integrity:
    contract_count_drop_warn_frac: 0.5   # partial-chain guard (CBOE has no truncation flag)
    audit_day_of_month: 1
    audit_time_et: "18:00"
    late_warn_s: 30.0                    # cron-jitter tolerance before a lateness warning fires (2026-07-16)
  backup:
    enabled: true
    rclone_remote: "b2:swingrl-options"
    time_et: "02:30"
  candle_jobs:                      # 2026-07-18: collector keeps OHLCV bars fresh (training paused); existing Alpaca/Binance ingestors, CBOE stays options-only
    enabled: true
    equity_time_et: "20:15"         # Mon–Fri; past 00:00 UTC (EDT+EST) so day-D bar lands day-D evening
    crypto_minute: 1                # minute past each 4H UTC bar close (0,4,8,12,16,20), ahead of the trader's :05 cycles
    equity_misfire_grace_s: 21600   # 6h: a late equity daily bar still valid to capture much later
    crypto_misfire_grace_s: 10800   # 3h: within a 4H cycle, past that skip rather than double-fire

calendar:                           # Plan A Task 11: FRED + FOMC -> calendar_events (jobs run in swingrl-collector)
  enabled: true
  fred_release_ids:                 # P-A4 verified live 2026-07-16 (release name == expected)
    cpi: 10                         # Consumer Price Index
    nfp: 50                         # Employment Situation
    gdp: 53                         # Gross Domestic Product
  window_hours:                     # [before, after] hours, materialized at ingest (D-T3.14)
    fomc: [24, 24]
    cpi: [12, 12]
    nfp: [12, 12]
    gdp: [12, 12]
  min_future_days: 10               # staleness alarm fires if newest future event nearer than this
  backfill_start: "2015-01-01"      # covers min(ohlcv_daily)=2016-01-04 (verified live)
  fomc_backfill_csv: config/fomc_dates_historical.csv   # historical decision dates for backfill
  ingest_day_of_week: sun           # weekly ingest (America/New_York)
  ingest_time_et: "06:30"
  staleness_check_time_et: "07:00"  # daily
  fomc_dates:                       # forward FOMC decision days, 14:00 ET (federalreserve.gov, 2026-07-16)
    - "2025-01-29T14:00:00"
    - "2025-03-19T14:00:00"
    - "2025-05-07T14:00:00"
    - "2025-06-18T14:00:00"
    - "2025-07-30T14:00:00"
    - "2025-09-17T14:00:00"
    - "2025-10-29T14:00:00"
    - "2025-12-10T14:00:00"
    - "2026-01-28T14:00:00"
    - "2026-03-18T14:00:00"
    - "2026-04-29T14:00:00"
    - "2026-06-17T14:00:00"
    - "2026-07-29T14:00:00"
    - "2026-09-16T14:00:00"
    - "2026-10-28T14:00:00"
    - "2026-12-09T14:00:00"
    - "2027-01-27T14:00:00"
    - "2027-03-17T14:00:00"
    - "2027-04-28T14:00:00"
    - "2027-06-09T14:00:00"
    - "2027-07-28T14:00:00"
    - "2027-09-15T14:00:00"
    - "2027-10-27T14:00:00"
    - "2027-12-08T14:00:00"

shadow:
  equity_eval_days: 10              # trading days to evaluate shadow equity model
  crypto_eval_cycles: 30            # 4H cycles to evaluate shadow crypto model
  auto_promote: true                # auto-promote shadow if it beats active
  mdd_tolerance_ratio: 1.2          # shadow MDD must be <= active_MDD * ratio

sentiment:
  enabled: false                   # OFF for era-0 paper trading (2026-07-18 user ruling):
                                   # deployed equity vintage iter_4 is 164-dim (pre-sentiment);
                                   # enabled:true builds 180-dim obs -> shape mismatch at cycle.
                                   # Re-enable only when an era trained WITH sentiment deploys.
  model_name: ProsusAI/finbert      # HuggingFace model for sentiment scoring
  max_headlines_per_asset: 10       # max news headlines per asset per cycle
  finnhub_api_key: ""               # OVERRIDE via SWINGRL_SENTIMENT__FINNHUB_API_KEY

security:
  key_rotation_days: 90             # reminder threshold for API key rotation
  env_file_permissions: "600"       # expected permissions on .env file

memory_agent:
  enabled: true                    # memory agent disabled by default — set true to enable
  meta_training: false              # LLM hyperparameter meta-training (disabled by default)
  base_url: "http://swingrl-memory:8889"
  api_key: ""                       # OVERRIDE via SWINGRL_MEMORY_AGENT__API_KEY in .env
  live_endpoints:
    obs_enrichment: false
    blend_weights: false
    position_advice: false
    trade_veto: false
    cycle_gate: false
    risk_thresholds: false
  cloud_block_on_429: true            # skip cloud providers that returned 429 today (resets daily UTC)
  cloud_block_codes: [429]            # HTTP status codes that trigger calendar-day blocking
  ollama_instances:
    - name: homelab
      url: "http://swingrl-ollama:11434"
      model: "qwen2.5:14b"
      timeout: 300
  # Epoch advice call frequency (fewer calls with smarter model = better than many garbage calls)
  epoch_cadence_ppo: 20                        # restored: ~4 calls/fold (was 60 → only 1.4/fold, 48% delivery failure)
  epoch_cadence_a2c: 8000                      # was 2000 → 4x fewer calls (~4 calls/fold)
  epoch_cadence_sac: 40000                     # was 10000 → 4x fewer calls (~4 calls/fold)
  epoch_cadence_default: 500                   # was 100
  # Control folds: fold indices that skip reward adjustments (scientific control group)
  # Empty list = all folds are treatment (backward compatible)
  control_folds_equity: [0, 5, 10, 15, 20]    # 5 control, ~18 treatment (spread across market regimes)
  control_folds_crypto: [0, 4, 9, 13]          # 4 control, ~10 treatment
  # Epoch aggregation parameters (used by consolidation to summarize epoch memories)
  outlier_iqr_mild: 1.5                     # Tukey mild fence multiplier for IQR outlier detection
  outlier_iqr_extreme: 3.0                  # Tukey extreme fence multiplier
  max_outlier_events: 3                     # max extreme events reported per metric per fold
  skewness_min_n: 8                         # min snapshots to compute skewness (unreliable below)
  confidence_n_low: 5                       # N <= this → "low" confidence label in fold summary
  confidence_n_high: 15                     # N >= this → "high" confidence label

  consolidation:
    provider: "mistral"                     # key into providers map (fast ~18s, openrouter as backup)
    model: ""                               # empty = use provider's default_model
    timeout_sec: 1800
    inter_phase_delay_sec: 60               # seconds between LLM calls to respect rate limits
    rate_limit_max_retries: 3               # max 429 retry attempts per provider
    rate_limit_backoff_base_sec: 30         # exponential backoff base (30, 60, 120s)
    min_confidence_for_advice: 0.4          # minimum confidence for patterns used in query advice
    max_patterns_per_merge: 2               # max patterns per dedup/merge LLM call
    providers:
      mistral:
        base_url: "https://api.mistral.ai/v1"
        api_key: ""                         # OVERRIDE via MISTRAL_API_KEY in .env
        default_model: "mistral-large-latest"
        timeout_sec: 600
        max_tokens: 128000
      openrouter:
        base_url: "https://openrouter.ai/api/v1"
        api_key: ""                         # OVERRIDE via OPENROUTER_API_KEY in .env
        default_model: "nvidia/nemotron-3-super-120b-a12b:free"
      gemini:
        base_url: "https://generativelanguage.googleapis.com/v1beta/openai/"
        api_key: ""                         # OVERRIDE via GEMINI_API_KEY in .env
        default_model: "gemini-2.5-flash"
        timeout_sec: 60
        max_tokens: 65536
      cerebras:
        base_url: "https://api.cerebras.ai/v1"
        api_key: ""                         # OVERRIDE via CEREBRAS_API_KEY in .env
        default_model: "qwen-3-235b-a22b-instruct-2507"
        timeout_sec: 30
        max_tokens: 65536
      groq:
        base_url: "https://api.groq.com/openai/v1"
        api_key: ""                         # OVERRIDE via GROQ_API_KEY in .env
        default_model: "meta-llama/llama-4-scout-17b-16e-instruct"
        timeout_sec: 30
        max_tokens: 8192                        # llama-4-scout hard limit; was 30000 (caused 400 on every call)
      nvidia:
        base_url: "https://integrate.api.nvidia.com/v1"
        api_key: ""                         # OVERRIDE via NVIDIA_API_KEY in .env
        default_model: "moonshotai/kimi-k2.5"

meta_trader:                          # Task 12: rotation-gated trade-time coach (skeleton)
  enabled: false                      # runtime gate — Task 16 go/no-go before switching on
  commentary_provider: cerebras       # provider for the mt-commentary-v0 shadow prompt

training:
  # Config lifecycle note: `bounds` below is loaded once into module-level constants
  # at import time (src/swingrl/memory/training/bounds.py:HYPERPARAM_BOUNDS/REWARD_BOUNDS/
  # ADJUSTMENT_COOLDOWN_STEPS/MAX_REWARD_DELTA) -- a container restart is required for
  # edits here to take effect. `windows` and `notable_events` below are re-read from
  # disk at the start of every fold (epoch_callback.py's _on_training_start /
  # _load_notable_events), so edits to those two blocks take effect on the next fold
  # with no restart needed.
  bounds:
    hyperparam_bounds:
      learning_rate: [0.00001, 0.001]
      entropy_coeff: [0.0, 0.05]
      clip_range: [0.1, 0.4]
      n_epochs: [3, 20]
      batch_size: [32, 512]
      gamma: [0.95, 0.995]
    reward_bounds:
      profit: [0.10, 0.70]
      sharpe: [0.10, 0.60]
      drawdown: [0.05, 0.50]
      turnover: [0.00, 0.20]
    # D-T2.1: L1 lever (mid-fold reward-weight nudges from epoch advice) is BENCHED.
    # All six algo/env pairs ship at 0.0 (disabled) — do NOT raise any value above
    # 0.0 without a passing lever-verification harness run first (spec Section 2.3,
    # docs/superpowers/specs/2026-06-12-training-system-redesign-design.md).
    # Prior research values (pre-bench) are documented in
    # .planning/research/algo-reward-shaping.md and kept as bounds.py's fail-open
    # fallback for config-load failure only.
    max_reward_delta:
      ppo:
        equity: 0.0
        crypto: 0.0
      a2c:
        equity: 0.0
        crypto: 0.0
      sac:
        equity: 0.0
        crypto: 0.0
    adjustment_cooldown_steps:       # minimum timesteps between successive L1 adjustments (unchanged by the bench)
      ppo: 24576                     # 2 × 2048 × 6 (value function recovery)
      a2c: 500                       # ~100 short rollouts (stability window)
      sac: 20000                     # replay buffer rotation
  windows:                          # §2.6: percent-of-fold rolling windows (replaces fixed 500-step deque for MDD)
    short_pct_of_fold: 0.01         # N1 — acute detector window (1% of fold total_timesteps)
    trend_pct_of_fold: 0.15         # N2 — decision-basis window (15% of fold total_timesteps);
                                    # must cover every algo's adjustment_cooldown_steps above —
                                    # enforced by a startup guard, not by this value alone.
  notable_events:                   # §4.10 (D-T3.19): F2 trigger set + rate/hard caps (retires
                                    # NOTABLE_KL_THRESHOLD / NOTABLE_MDD_THRESHOLD module constants)
    kl_spike_threshold: 0.10         # N3 — approx_kl above this fires kl_spike (unchanged value)
    mdd_breach_frac:                 # N3 — window_metrics("short")["mdd_frac_worst"] ceiling, per env
      equity: 0.10
      crypto: 0.12
    trade_shy_ratio: 0.5             # N3 — trade_rate < 0.5x locked baseline_trade_rate -> trade_shy
    churning_ratio: 3.0              # N3 — trade_rate > 3x locked baseline_trade_rate -> churning
    hard_cap_per_run: 50             # N4 — total event rows/run; past this, rows drop + one alarm
                                    # (cadence heartbeat rows are never capped)
  sac_buffer_size: 200000           # SAC replay buffer. Was 500K; reduced per research (smaller=better for non-stationary)
  n_envs: 6                         # Parallel envs per training (SubprocVecEnv). 6 × 3 algo workers = 18 processes.
  vecenv_backend: subproc            # "subproc" for parallel SubprocVecEnv, "dummy" for sequential DummyVecEnv

features:
  equity_zscore_window: 252        # rolling z-score window for equity (trading days)
  crypto_zscore_window: 360        # rolling z-score window for crypto (4H bars ~60 days)
  equity_hmm_window: 1260          # HMM fitting window for equity (5 years daily)
  crypto_hmm_window: 2000          # HMM fitting window for crypto (4H bars ~1 year)
  hmm_n_iter: 200                  # max EM iterations per HMM fit
  hmm_n_inits: 5                   # random initializations, best log-likelihood wins
  hmm_ridge: 0.000001             # ridge regularization for HMM covariance stability
  correlation_threshold: 0.85      # Pearson r threshold for feature pruning
  zscore_epsilon: 0.00000001      # floor for rolling std to prevent division by zero
  equity_turbulence_warmup: 252    # expanding lookback warmup for equity turbulence
  equity_turbulence_half_life: 126 # EWMA half-life for equity Mahalanobis (trading days)
  crypto_turbulence_window: 1080   # realized-vol percentile lookback for crypto OR-gate (4H bars)
  crypto_turbulence_warmup: 1080   # crypto turbulence minimum warmup bars (raised 360->1080)
  crypto_turbulence_half_life: 750 # EWMA half-life for crypto Mahalanobis (4H bars)
  turbulence_halt_percentile: 0.97       # hard-halt percentile (method review 2026-07-07)
  turbulence_baseline_lookback_equity: 756  # trailing baseline window (~3y trading days)
  turbulence_baseline_lookback_crypto: 0    # 0 = full-history baseline for crypto
