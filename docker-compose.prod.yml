# docker-compose.prod.yml — Production deployment for homelab paper trading.
#
# Uses the multi-stage Dockerfile 'production' target (excludes dev deps).
# Intended for homelab deployment with TRADING_MODE=paper.
#
# Usage:
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml logs -f
#   docker compose -f docker-compose.prod.yml down
#
# Required .env file with:
#   ALPACA_API_KEY=...
#   ALPACA_SECRET_KEY=...
#   DISCORD_WEBHOOK_URL=...

services:
  swingrl-ollama:
    container_name: swingrl-ollama
    image: ollama/ollama:latest
    # No memory or CPU limits — dedicated inference for epoch advice.
    # qwen3:1.7b uses ~1.5 GB RAM. Let the OS manage resources.
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"    # Different host port to avoid ragflow conflict
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  swingrl-memory:
    container_name: swingrl-memory
    build:
      context: ./services/memory
      dockerfile: Dockerfile
    # Port exposed to host for validation scripts and operator curl commands.
    ports:
      - "127.0.0.1:8889:8889"
    # 1 GB RAM / 1 CPU for consolidation workload headroom. Soft limit, shared CPUs.
    mem_limit: 1g
    cpus: 1.0
    env_file: .env
    volumes:
      - ./db:/app/db
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8889/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # swingrl-trader (A30 deploy isolation) — the paper-trading scheduler
  # (Dockerfile CMD `python scripts/main.py`). Image pinned to an EXPLICIT tag (never
  # :latest), bumped ONLY by hand in a market-safe window with a no-in-flight-cycle check.
  # Routine training rebuilds are service-scoped (`docker compose build swingrl-trainer`)
  # and never touch this tag. See docs/training/deploy-process.md.
  swingrl-trader:
    container_name: swingrl        # kept so existing runbooks / `docker exec swingrl` keep working
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: swingrl:trader-2026-07-16
    # No mem_limit — swingrl-trader is the primary workload on 64 GB homelab.
    cpus: 10.0
    # Secrets loaded from .env; .env carries the Discord webhook overrides
    # (SWINGRL_ALERTING__ALERTS_WEBHOOK_URL / __DAILY_WEBHOOK_URL) the Alerter reads.
    env_file: .env
    environment:
      - SWINGRL_TRADING_MODE=paper
      - TZ=America/New_York
    # Bind mounts: data persists on the host across container restarts.
    # Paths match trader user's /app working directory inside the container.
    volumes:
      - ./data:/app/data
      - ./db:/app/db
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
      - ./status:/app/status
    depends_on:
      swingrl-memory:
        # Soft dependency: memory agent is optional; app handles unavailability gracefully
        condition: service_started
    restart: unless-stopped

  # swingrl-trainer (A30 deploy isolation) — SAME image build as the trader, PROFILE-GATED
  # so a bare `docker compose up -d` never starts or recreates it. Invoke training via
  #   docker compose --profile training build swingrl-trainer
  #   docker compose run --rm swingrl-trainer python scripts/train_pipeline.py --config ...
  # Idle default command prevents an accidental 2nd scheduler. Writes models/iterations/ +
  # shadow only — never the live models/active tree (see the write ban test).
  swingrl-trainer:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: swingrl:trainer-latest
    profiles:
      - training
    cpus: 10.0
    env_file: .env
    environment:
      - TZ=America/New_York
    command: ["sleep", "infinity"]
    volumes:
      - ./data:/app/data
      - ./db:/app/db
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      swingrl-memory:
        condition: service_started
    restart: "no"

  swingrl-dashboard:
    container_name: swingrl-dashboard
    build:
      context: .
      dockerfile: dashboard/Dockerfile.dashboard
    mem_limit: 512m
    cpus: 0.5
    environment:
      - SWINGRL_DB_DIR=/app/db
      - TZ=America/New_York
    volumes:
      - ./db:/app/db:ro        # Read-only access to databases
      - ./models:/app/models:ro  # Read-only for model metadata
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - swingrl-trader

volumes:
  ollama_data:    # Named volume for Ollama model persistence across container restarts
