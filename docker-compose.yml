# docker-compose.yml — Production deployment for homelab paper trading.
#
# Uses the multi-stage Dockerfile 'production' target (excludes dev deps).
# Intended for homelab deployment with TRADING_MODE=paper.
#
# PostgreSQL: uses existing pg16 container on br0 network.
# DATABASE_URL set via .env file on the host.
#
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
#
# Required .env file with:
#   ALPACA_API_KEY=...
#   ALPACA_SECRET_KEY=...
#   DISCORD_WEBHOOK_URL=...
#   DATABASE_URL=postgresql://swingrl:<password>@pg16:5432/swingrl

services:
  swingrl-ollama:
    container_name: swingrl-ollama
    image: ollama/ollama:latest
    # No memory or CPU limits — dedicated inference for epoch advice.
    # qwen2.5:1.5b uses ~1.2 GB RAM. Let the OS manage resources.
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11435:11434"    # Different host port to avoid ragflow conflict
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  swingrl-memory:
    container_name: swingrl-memory
    build:
      context: ./services/memory
      dockerfile: Dockerfile
    # Port exposed to host for validation scripts and operator curl commands.
    ports:
      - "127.0.0.1:8889:8889"
    # 1 GB RAM / 1 CPU for consolidation workload headroom. Soft limit, shared CPUs.
    mem_limit: 1g
    cpus: 1.0
    env_file: .env
    volumes:
      - ./data:/app/data
      - ./config:/app/config
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8889/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default
      - br0
    restart: unless-stopped

  # swingrl-trader (A30 deploy isolation) — the paper-trading scheduler
  # (Dockerfile CMD `python scripts/main.py`). The image is pinned to an EXPLICIT tag
  # (never :latest) and bumped ONLY by hand in a market-safe window (equity >=~16:05 ET
  # after the 15:45 cycle + fill polling; crypto between 4H cycles) with a no-in-flight-cycle
  # check. Routine training rebuilds are service-scoped (`docker compose build swingrl-trainer`)
  # and never touch this tag; a bare `up -d` only recreates the trader when its tag actually
  # moved. NEVER run a bare `docker compose build` (it would silently re-tag this image).
  # See docs/training/deploy-process.md.
  swingrl-trader:
    container_name: swingrl        # kept so existing runbooks / `docker exec swingrl` keep working
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: swingrl:trader-2026-07-24-1
    # No mem_limit — swingrl-trader is the primary workload on 64 GB homelab.
    # Other containers use ~1.5 GB (memory 1G + dashboard 0.5G).
    cpus: 10.0
    # Secrets loaded from .env on the host; never baked into the image. .env carries the
    # Discord webhook overrides (SWINGRL_ALERTING__ALERTS_WEBHOOK_URL / __DAILY_WEBHOOK_URL) —
    # the Alerter reads config.alerting.*, NOT the legacy DISCORD_WEBHOOK_URL (T16 fix).
    env_file: .env
    environment:
      - SWINGRL_TRADING_MODE=paper
      - TZ=America/New_York
    # Bind mounts: data persists on the host across container restarts.
    # Paths match trader user's /app working directory inside the container.
    volumes:
      - ./data:/app/data
      - ./db:/app/db
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
      - ./status:/app/status
    depends_on:
      swingrl-memory:
        # Soft dependency: memory agent is optional; app handles unavailability gracefully
        condition: service_started
    networks:
      - default
      - br0
    restart: unless-stopped

  # swingrl-trainer (A30 deploy isolation) — the SAME image build as the trader, but
  # PROFILE-GATED so a bare `docker compose up -d` never starts or recreates it. Training
  # is invoked explicitly and ephemerally:
  #   docker compose --profile training build swingrl-trainer            # service-scoped build
  #   docker compose run --rm swingrl-trainer python scripts/train_pipeline.py --config ...
  # The default command is an idle no-op so an accidental start can never launch a 2nd
  # scheduler. Training writes models/iterations/ + shadow only — NEVER the live
  # models/active tree (the trader loader hot-reloads on mtime; enforced by the write ban
  # in tests/test_deploy_isolation.py). Its own :trainer-latest tag keeps trainer rebuilds
  # from ever moving the trader's pinned tag. SAC replay buffer (500K × n_envs=6) + 36
  # SubprocVecEnv fork workers peak ~12-15 GB during training — the OS manages memory.
  swingrl-trainer:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: swingrl:trainer-latest
    profiles:
      - training
    cpus: 10.0
    env_file: .env
    environment:
      - TZ=America/New_York
    command: ["sleep", "infinity"]
    volumes:
      - ./data:/app/data
      - ./db:/app/db
      - ./models:/app/models
      - ./logs:/app/logs
      - ./config:/app/config
    depends_on:
      swingrl-memory:
        condition: service_started
    networks:
      - default
      - br0
    restart: "no"

  swingrl-collector:
    container_name: swingrl-collector
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    # Pinned tag (D9): bumped by hand, only outside the 15:30-16:45 ET quiet window.
    # A bare `docker compose up -d` after unrelated image builds must not recreate this.
    image: swingrl-collector:2026-07-22-1
    cpus: 2.0
    env_file: .env
    environment:
      - TZ=America/New_York
    command: ["python", "scripts/collector_main.py"]
    volumes:
      - ./data:/app/data
      - ./db:/app/db
      - ./config:/app/config
      - ./logs:/app/logs
    networks:
      - default
      - br0
    restart: unless-stopped

  swingrl-dashboard:
    container_name: swingrl-dashboard
    build:
      context: .
      dockerfile: dashboard/Dockerfile.dashboard
    mem_limit: 512m
    cpus: 0.5
    env_file: .env
    environment:
      - TZ=America/New_York
    volumes:
      - ./models:/app/models:ro  # Read-only for model metadata
    ports:
      - "8501:8501"
    restart: unless-stopped
    depends_on:
      - swingrl-trader
    networks:
      - default
      - br0

networks:
  default:
    # Internal network for swingrl services to talk to each other
  br0:
    external: true
    # Shared homelab network — gives access to pg16 container

volumes:
  ollama_data:    # Named volume for Ollama model persistence across container restarts
